<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TODO: Set the document title to the name of your application -->
    <title>Jose Marie De Castro</title>
    <meta name="description" content="Jose Marie De Castro's Personal Website" />
    <meta name="author" content="Jose Marie De Castro" />

    <!-- TODO: Update og:title to match your application name -->
    <meta property="og:title" content="Jose Marie De Castro" />
    <meta property="og:description" content="Personal Website of Jose Marie De Castro" />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="theme-color" content="#0C1524" />

    <!-- Apply the stored/system theme before first paint so there is no flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var isDark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage unavailable — fall back to the light default */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
