server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx only gzips text/html by default, which is why the JS and CSS
    # bundles were going out uncompressed (508 KB of JS on every cold load).
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript text/javascript
                    application/json application/xml image/svg+xml
                    font/woff font/woff2;

    location /api/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback. Deliberately no `$uri/` term: public/work/ ships real
    # directories of case-study images, so `$uri/` matched /work/omni/ as a
    # directory and returned 301 -> 403 instead of handing the route to the
    # app router. Same trap awaits any future route that shadows an asset dir.
    location / {
        try_files $uri /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|avif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
